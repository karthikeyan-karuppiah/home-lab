version: "3.8"

services:
  app:
    container_name: doco-cd
    # CL-0019: Pinned to exact stable version 0.131.0 alongside its immutable sha256 container digest footprint
    image: ghcr.io/kimdre/doco-cd:0.131.0@sha256:7f45c8ec42b6a9c12b26098d1e641d67a851268da995b07bef5ce38a6976dfd
    restart: unless-stopped

    # CL-0018: Drop host-root permissions by executing under an unprivileged user space
    user: "1000:1000"

    # CL-0007: Deny container file system mutations to prevent malware persistence
    read_only: true

    # CL-0003: Prevent child processes from gathering execution privileges (e.g., via setuid binaries)
    security_opt:
      - no-new-privileges:true

    ports:
      # CL-0005: Bind Prometheus metrics strictly to localhost to insulate them from the LAN/public web
      - "127.0.0.1:9120:9120"

    environment:
      TZ: Europe/Berlin

      # SOPS / Age key identification map for runtime repository decryption
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key

      # Injected dynamically from the localized .env file by the deployment pipeline
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN}

      # Declarative Doco-CD polling configuration tracker for state reconciliation
      POLL_CONFIG: |
        - url: https://github.com
          reference: main
          interval: 1800
          target: ""

    volumes:
      # CL-0001: Required to orchestrate target stacks on the TNAS host (Suppressed via .compose-lint.yaml)
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

    tmpfs:
      # Ephemeral memory volumes providing writable paths required by the read-only application layer
      - /tmp
      - /run

    cap_drop:
      # CL-0006: Drop all default Linux kernel privileges; Doco-CD requires no capabilities to run
      - ALL

    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

    secrets:
      - sops_age_key

    deploy:
      resources:
        limits:
          # CL-0026: Enforce resource ceilings to prevent container execution from starving the host NAS
          cpus: '0.25'
          memory: 256M

secrets:
  sops_age_key:
    # Reference target file paths directly inside your secured system directory configurations
    file: /volume1/.config/age/keys.txt

volumes:
  data:
