name: Continuous Integration

# Event Triggers (Webhook Configuration)
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
    # Prevent wasted runner billable minutes.
    # Documentation or configuration-only changes should not spin up infrastructure.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

# -----------------------------------------------------------------------------
# Concurrency Management (Anti-Race Condition Logic)
# -----------------------------------------------------------------------------
concurrency:
  # Isolates execution contexts cleanly.
  # If a developer pushes a new commit to an active PR, the old running job
  # is safely terminated, preserving compute costs. Using the PR number ensures
  # separate PRs do not conflict with or cancel each other out.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# Zero-Trust Global Permissions Matrix
# -----------------------------------------------------------------------------
# Principal of Least Privilege.
# Explicitly revokes all default token permissions globally.
# Each standalone job must request its own granular scopes down below.
permissions: {}

jobs:
  # ===========================================================================
  # Job: Supply-Chain Gate — GitHub Actions Lockfile Verification
  # ===========================================================================
  verify-lockfile:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    # Fast fail-safe timeout for lockfile verification
    timeout-minutes: 5

    # Read-only repository access is all that is needed to verify actions.lock
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify workflow lockfile
        run: gh actions-lock --verify

  # ===========================================================================
  # Job: Static Analysis, Infrastructure, & Security Scans
  # ===========================================================================
  lint-and-scan:
    name: Lint & Security Scans
    # Ensures lockfile supply-chain verification passes before executing scans
    needs: verify-lockfile
    runs-on: ubuntu-latest
    # Hard constraint to break out of hanging or frozen test tasks
    timeout-minutes: 15

    # Scoped permissions specifically for security evaluations and scanning
    permissions:
      # Required to pull and read codebase context
      contents: read
      # Required to contextualize PR workflows
      pull-requests: read
      # Enables uploading vulnerabilities directly to GitHub Security dashboard
      security-events: write

    steps:
      # -----------------------------------------------------------------------
      # Source Code Lifecycle
      # -----------------------------------------------------------------------
      # Uses verified release tags to handle core repository checkouts.
      # 'persist-credentials: false' keeps the local .git token secure from local scripts.
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          # Fetches entire history, required for accurate commit scans (Gitleaks)
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Compliance Gate: Push Commit Message Validation
      # -----------------------------------------------------------------------
      # Runs only on direct branch pushes (PR titles are validated by pr-lint.yml).
      - name: Validate Push Commit Message
        if: github.event_name == 'push'
        uses: $/.github/actions/validate-push-commit

      # -----------------------------------------------------------------------
      # Static Analysis & Container Configuration Linting
      # -----------------------------------------------------------------------
      # Runs yamllint, docker compose config, compose-lint, and Hadolint.
      - name: Lint YAML, Compose, & Dockerfiles
        uses: $/.github/actions/lint-containers
        with:
          enforce-compose-lint: 'false'

      # -----------------------------------------------------------------------
      # Threat Management: Secret Scanning (Gitleaks)
      # -----------------------------------------------------------------------
      # Evaluates all raw commits to confirm credentials or access keys weren't accidentally added.
      - name: Scan for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Vulnerability Assessment: Trivy Secrets, Image CVEs & SBOMs
      # -----------------------------------------------------------------------
      - name: Run Trivy Secret & Container Scans
        uses: $/.github/actions/trivy-security
        with:
          trivy-version: 'v0.76.1'
          enforce-image-cves: 'false'
