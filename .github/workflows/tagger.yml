name: CI & Automatic SemVer Tagging

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Native Yamllint
      - name: Run Native YAML Lint Check
        run: |
          echo "=== Running Native YAML Validation ==="
          echo -e "extends: default\nrules:\n  line-length: disable\n  document-start: disable" > .yamllint
          yamllint -c .yamllint .

      # 2. Native Compose Validation
      - name: Validate Docker Compose Structural Integrity
        run: |
          echo "=== Verifying Docker Compose Specifications ==="
          find . -name "docker-compose.yml" -o -name "compose.yml" | while read -r file; do
            echo "Checking integrity of specification profile: $file"
            docker compose -f "$file" config --quiet
          done

      # 3. Native Hadolint Dockerfile Check
      - name: Validate Dockerfile Best Practices with Hadolint
        run: |
          echo "=== Running Native Dockerfile Lint Checks ==="
          find . -name "Dockerfile" -o -name "*.dockerfile" | while read -r file; do
            echo "Linting Dockerfile: $file"
            docker run --rm -i hadolint/hadolint < "$file"
          done

      # 4. ADDED: Native Secret Scanning (Gitleaks Zero-Dependency Execution)
      # Blocks pushes instantly if an unencrypted token or key is found in the diff history
      - name: Audit Repository for Secret & Token Leaks
        run: |
          echo "=== Running Native Secret Detection Pass ==="
          docker run --rm -v "$(pwd):/path" zricethezav/gitleaks:v8.18.2 detect --source="/path" --verbose --redact

      # 5. ADDED: Native Container Security Scan (Aqua Trivy Zero-Dependency Execution)
      # Audits your infrastructure/ compose files for known CVE vulnerabilities
      - name: Audit Infrastructure Compose Images for CVE Vulnerabilities
        run: |
          echo "=== Running Vulnerability Audits on Image Registries ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/.cache:/root/.cache/ aquasec/trivy:0.49.1 config .

  deploy-tag:
    runs-on: ubuntu-latest
    needs: lint-infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          with_v: true
          default_bump: patch

      - name: Output Generated Version Details
        run: |
          echo "=== New Version Successfully Generated ==="
          echo "Full Git Tag Created: ${{ steps.tag_version.outputs.new_tag }}"
          echo "Raw SemVer Release Version: ${{ steps.tag_version.outputs.new_version }}"
          echo "The change type was calculated as a: ${{ steps.tag_version.outputs.part }}"
