# =============================================================================
# CI + Automated Semantic Versioning with Release Please
# =============================================================================
# This workflow does two main things:
#   1. Runs quality & security checks on every push / PR to main
#   2. Automatically creates GitHub Releases + changelogs using Conventional Commits
#
# Requirements:
#   - You must use Conventional Commit messages (feat:, fix:, chore:, etc.)
#   - Branch protection recommended (make "Lint & Security Scans" a required check)
# =============================================================================

name: CI & Release Please

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress runs for the same branch.
# This saves GitHub Actions minutes and prevents race conditions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions (security best practice)
permissions:
  contents: read
  pull-requests: read
  # write permissions are only granted in the release job

jobs:
  # ===========================================================================
  # Job 1: Lint & Security Scans
  # ===========================================================================
  lint-and-scan:
    name: Lint & Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is needed for accurate secret scanning
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Caching – speeds up subsequent runs significantly
      # -----------------------------------------------------------------------
      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ hashFiles('**/*compose*.yml', '**/Dockerfile*') }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      # -----------------------------------------------------------------------
      # 1. YAML Linting
      # -----------------------------------------------------------------------
      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          # Disable a few rules that are too noisy for infrastructure repos
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable

      # -----------------------------------------------------------------------
      # 2. Docker Compose validation
      # -----------------------------------------------------------------------
      - name: Validate Docker Compose files
        run: |
          set -euo pipefail
          echo "Looking for compose files..."
          find . -type f \( -name "docker-compose.yml" -o -name "compose.yml" -o -name "compose.yaml" \) | while read -r file; do
            echo "→ Validating $file"
            docker compose -f "$file" config --quiet
          done

      # -----------------------------------------------------------------------
      # 3. Dockerfile best practices (Hadolint)
      # -----------------------------------------------------------------------
      - name: Lint Dockerfiles with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          # Fail only on errors, show warnings
          failure-threshold: warning
          recursive: true

      # -----------------------------------------------------------------------
      # 4. Secret scanning (Gitleaks)
      # Run early so we fail fast if a secret is leaked
      # -----------------------------------------------------------------------
      - name: Scan for leaked secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: only needed if you use Gitleaks Pro features
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # -----------------------------------------------------------------------
      # 5. Infrastructure / Config vulnerability scanning (Trivy)
      # -----------------------------------------------------------------------
      - name: Scan infrastructure files for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config          # Scan IaC / compose / Dockerfiles
          scan-ref: .
          severity: CRITICAL,HIGH    # Only fail on serious issues
          exit-code: "1"             # Make the job fail if findings exist
          ignore-unfixed: true       # Don't fail on issues that have no fix yet

  # ===========================================================================
  # Job 2: Automated Release (only on pushes to main)
  # ===========================================================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: lint-and-scan
    # Only run on pushes to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # This job needs write access to create releases and tags
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use the token that GitHub Actions provides
          token: ${{ secrets.GITHUB_TOKEN }}

          # Tell release-please this is a simple Node-style versioning repo
          # (works well for infrastructure / monorepo-style repos too)
          release-type: simple

          # Optional: create a GitHub Release (recommended)
          # You can also set this to false if you only want tags
          # package-name: home-lab

      # -----------------------------------------------------------------------
      # Optional: do something after a real release is created
      # -----------------------------------------------------------------------
      - name: Post-release summary
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "### 🚀 New Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${{ steps.release.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Release URL: ${{ steps.release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY