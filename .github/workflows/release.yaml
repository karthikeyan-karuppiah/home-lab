# =============================================================================
# Pipeline 2: CD / Automated Release (Triggered by Pipeline 1)
# =============================================================================
# Core Architecture & Security Model:
#   1. Event-Driven Chains: Uses workflow_run to isolate privileged release tokens.
#   2. Strict Origin Guardrails: Verifies push-only, same-repo, successful CI runs.
#   3. Serialized Execution: Concurrency group prevents release-please tag races.
# =============================================================================

name: Release Management

# -----------------------------------------------------------------------------
# Chained Workflow Trigger Configuration
# -----------------------------------------------------------------------------
on:
  workflow_run:
    # Must match the exact top-level `name:` field in .github/workflows/ci.yaml
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main

# -----------------------------------------------------------------------------
# Concurrency Management (Prevents Release-Please PR / Tag Race Conditions)
# -----------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# -----------------------------------------------------------------------------
# Zero-Trust Global Permissions Matrix
# -----------------------------------------------------------------------------
permissions: {}

jobs:
  # ===========================================================================
  # Job: Automated Semantic Versioning and Code Release Management
  # ===========================================================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Fail-safe timeout to prevent hung API calls
    timeout-minutes: 10

    # Security Constraint (Three-Part Origin & Status Gate):
    # 1. Triggering CI workflow must have succeeded (`conclusion == 'success'`).
    # 2. Triggering event must be a direct `push` to `main` (never a fork `pull_request`).
    # 3. Head repository must match this repository (`head_repository.full_name == repository`).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    # Scoped permissions required by release-please to open release PRs and create GitHub Releases
    permissions:
      contents: write
      pull-requests: write

    steps:
      # -----------------------------------------------------------------------
      # Semantic Versioning Release Core
      # -----------------------------------------------------------------------
      # Parses Conventional Commits (e.g., feat:, fix:) via the GitHub API to
      # maintain release PRs, CHANGELOG.md, and semantic Git tags.
      - name: Run Release Please
        uses: googleapis/release-please-action@v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # -----------------------------------------------------------------------
      # Output Logging and Reporting
      # -----------------------------------------------------------------------
      # Uses brace encapsulation and standard file writers ('>>')
      # to prevent script-injection opportunities within echo contexts.
      - name: Post-release summary
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          set -euo pipefail
          {
            echo "### 🚀 New Release Created"
            echo "- Version: \`${{ steps.release.outputs.tag_name }}\`"
            echo "- Release URL: ${{ steps.release.outputs.html_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
