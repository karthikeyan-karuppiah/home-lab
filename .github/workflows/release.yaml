# =============================================================================
# Pipeline 2: CD / Automated Release (Triggered by Pipeline 1)
# =============================================================================
# Core Architecture & Security Model:
#   1. Event-Driven Chains: Uses workflow_run to connect disparate work scopes.
#   2. Cross-Boundary Data Retrieval: Discovers and pulls historical workflow logs.
#   3. Guardrails: Validates execution context outputs to prevent toxic data injection.
# =============================================================================

name: Release Management

# -----------------------------------------------------------------------------
# Chained Workflow Trigger Configuration
# -----------------------------------------------------------------------------
on:
  workflow_run:
    # Must explicitly match the name property string of your primary pipeline file
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main

# -----------------------------------------------------------------------------
# Zero-Trust Global Permissions Matrix
# -----------------------------------------------------------------------------
permissions: {}

jobs:
  # ===========================================================================
  # Job: Automated Semantic Versioning and Code Release Management
  # ===========================================================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    
    # Security Constraint: 
    # workflow_run fires when the target pipeline ends, REGARDLESS of whether it passed or failed.
    # We must enforce a strict boolean check ensuring the CI run status was exactly 'success'.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # Grants write access to create code tags, releases, and automatically open PR changelogs
    permissions:
      contents: write
      pull-requests: write
      actions: read # Security: CRITICAL permission required to query historical pipeline runs

    steps:
      # -----------------------------------------------------------------------
      # Cross-Pipeline Download Resolution
      # -----------------------------------------------------------------------
      # Because workflow_run evaluates independently, we must explicitly request the
      # artifact tied to the exact triggering run event (`github.event.workflow_run.id`).
      - name: Download Artifact from Triggering Pipeline
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: deployment-payload
          # Identifies the unique execution ID from Pipeline 1 that fired this event loop
          run-id: ${{ github.event.workflow_run.id }} 
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: fetched-payload

      # Validate the payload contents safely to verify the structural integrity of transit.
      - name: Verify Received Data
        run: |
          echo "=== Verifying Artifact Integrity ==="
          cat fetched-payload/metadata.txt

      # -----------------------------------------------------------------------
      # Semantic Versioning Release Core
      # -----------------------------------------------------------------------
      # Parses Conventional Commits (e.g., feat:, fix:) to automatically increment versions.
      - name: Run Release Please
        uses: googleapis/release-please-action@701de7de0ca25e24cb1c360980cfb1e4c7ba3384 # v4.1.3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple # Suitable for universal mono-repos and simple software architectures

      # -----------------------------------------------------------------------
      # Output Logging and Reporting
      # -----------------------------------------------------------------------
      # Uses brace encapsulation and standard file writers ('>>')
      # to prevent dangerous script-injection opportunities within echo contexts.
      - name: Post-release summary
        if: ${{ steps.release.outputs.release_created }}
        run: |
          {
            echo "### 🚀 New Release Created"
            echo "- Version: \`${{ steps.release.outputs.tag_name }}\`"
            echo "- Release URL: ${{ steps.release.outputs.html_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
