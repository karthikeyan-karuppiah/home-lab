services:
  renovate:
    image: renovate/renovate:44.181.0
    container_name: renovate
    restart: "no"
    user: "0:0"
    
    secrets:
      - age-key
      - renovate-token
      
    environment:
      SOPS_AGE_KEY_FILE: /run/secrets/age-key
      LOG_LEVEL: info
      RENOVATE_AUTODISCOVER: "false"
      RENOVATE_REPOSITORIES: karthikeyan-karuppiah/home-lab
      RENOVATE_PLATFORM: github
      RENOVATE_ONBOARDING: "true"
      RENOVATE_GIT_AUTHOR: "Karthikeyan Karuppiah <your-github-email@example.com>"
      
    volumes:
      # Preservation cache directory
      - /Volume1/homes/carthy_k/renovate/cache:/usr/src/app/tmp
      
      # FIX: Mount your working NAS host sops binary directly as an execution mapping.
      # This completely bypasses container file-ownership and multi-stage permissions blocks.
      - /usr/local/bin/sops:/usr/local/bin/sops:ro

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "=== Age key file ==="
        ls -l /run/secrets/age-key
        echo "--- content (first 10 lines) ---"
        head -10 /run/secrets/age-key
        echo "===================="

        # Download sops (same as before)
        if command -v curl >/dev/null 2>&1; then DL="curl -fsSL"; else DL="wget -qO-"; fi
        ARCH=$$(uname -m)
        case $$ARCH in x86_64) SOPS_ARCH=amd64;; aarch64|arm64) SOPS_ARCH=arm64;; *) exit 1;; esac
        $$DL "https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.$${SOPS_ARCH}" > /tmp/sops
        chmod +x /tmp/sops

        export SOPS_AGE_KEY_FILE=/run/secrets/age-key

        echo "=== Trying decrypt with verbose ==="
        /tmp/sops --decrypt --input-type dotenv --verbose /run/secrets/renovate-token || true

        exit 1



secrets:
  renovate-token:
    file: ./docker-compose.enc.env
  age-key:
    # Reaches out to your primary, master private age key file on the local NAS filesystem path
    file: /volume1/.config/age/keys.txt
