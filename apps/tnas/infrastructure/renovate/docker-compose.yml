version: '3.8'
services:
  renovate:
    image: renovate/renovate:44.181.0
    container_name: renovate
    # Runs once and turns off to save your NAS memory RAM
    restart: "no"
    
    # Tight security profiles
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
      
    # Mounts the secret into secure container RAM at /run/secrets/renovate-token
    secrets:
      - renovate-token
      
    environment:
      - RENOVATE_TOKEN_FILE=/run/secrets/renovate-token
      - LOG_LEVEL=trace
      - RENOVATE_AUTODISCOVER=false
      - RENOVATE_REPOSITORIES=karthikeyan-karuppiah/home-lab
      - RENOVATE_PLATFORM=github
      - RENOVATE_ONBOARDING=true
      
    volumes:
      # Data cache mapping on your hard drive
      - /Volume1/homes/carthy_k/renovate/cache:/usr/src/app/tmp
      # Maps your script wrapper into the execution path
      - ./renovate-wrapper.sh:/usr/local/bin/renovate-wrapper.sh:ro
      
    entrypoint: ["/bin/sh", "/usr/local/bin/renovate-wrapper.sh"]

secrets:
  renovate-token:
    file: ./docker-compose.enc.env
