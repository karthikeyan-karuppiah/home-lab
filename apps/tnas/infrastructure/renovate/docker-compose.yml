services:
  renovate:
    image: renovate/renovate:44.181.0
    container_name: renovate
    restart: "no"
    user: "0:0"
    
    secrets:
      - age-key
      - renovate-token
      
    environment:
      SOPS_AGE_KEY_FILE: /run/secrets/age-key
      LOG_LEVEL: info
      RENOVATE_AUTODISCOVER: "false"
      RENOVATE_REPOSITORIES: karthikeyan-karuppiah/home-lab
      RENOVATE_PLATFORM: github
      RENOVATE_ONBOARDING: "true"
      RENOVATE_GIT_AUTHOR: "Karthikeyan Karuppiah <your-github-email@example.com>"
      
    volumes:
      # Data cache mapping
      - /Volume1/homes/carthy_k/renovate/cache:/usr/src/app/tmp
      
      # FIX: Point strictly to the exact binary path inside the mozilla image (/app/sops)
      - sops-binary:/usr/local/bin/sops:ro

    entrypoint: 
      - /bin/sh
      - -c
      - |
        # Step 1: Use the pre-mounted, Alpine-compatible SOPS binary to decrypt your token mount straight to RAM
        export RENOVATE_TOKEN=$$(sops --decrypt --extract '["RENOVATE_TOKEN"]' /run/secrets/renovate-token)
        
        # Step 2: Drop out of the shell wrapper and pass execution cleanly to the main Renovate engine
        exec renovate "$$@"

    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "30 1 * * *"
      cd.doco.job.execution_mode: "one_off"
      cd.doco.job.skip_running: "true"

  sops-provider:
    image: mozilla/sops:v3.7.3
    container_name: sops-provider
    # Fix the volume path mapping here to match the image structure
    volumes:
      - sops-binary:/app:ro
    entrypoint: ["/bin/true"]

volumes:
  sops-binary:

secrets:
  renovate-token:
    file: ./docker-compose.enc.env
  age-key:
    # Reaches out to your primary, master private age key file on the local NAS filesystem path
    file: /volume1/.config/age/keys.txt
