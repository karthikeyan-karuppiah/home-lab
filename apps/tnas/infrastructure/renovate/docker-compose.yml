services:
  renovate:
    image: renovate/renovate:44.181.0
    container_name: renovate
    restart: "no"
    user: "0:0"
    
    secrets:
      - age-key
      - renovate-token
      
    environment:
      SOPS_AGE_KEY_FILE: /run/secrets/age-key
      LOG_LEVEL: info
      RENOVATE_AUTODISCOVER: "false"
      RENOVATE_REPOSITORIES: karthikeyan-karuppiah/home-lab
      RENOVATE_PLATFORM: github
      RENOVATE_ONBOARDING: "true"
      RENOVATE_GIT_AUTHOR: "Karthikeyan Karuppiah <your-github-email@example.com>"
      
    volumes:
      # Preservation cache directory
      - /Volume1/homes/carthy_k/renovate/cache:/usr/src/app/tmp
      
      # FIX: Mount your working NAS host sops binary directly as an execution mapping.
      # This completely bypasses container file-ownership and multi-stage permissions blocks.
      - /usr/local/bin/sops:/usr/local/bin/sops:ro

    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        # Use wget if curl is missing (common in renovate image)
        if command -v curl >/dev/null 2>&1; then
          DL="curl -fsSL"
        elif command -v wget >/dev/null 2>&1; then
          DL="wget -qO-"
        else
          echo "ERROR: neither curl nor wget available" >&2
          exit 1
        fi

        ARCH=$$(uname -m)
        case $$ARCH in
          x86_64)  SOPS_ARCH=amd64 ;;
          aarch64|arm64) SOPS_ARCH=arm64 ;;
          armv7l)  SOPS_ARCH=arm ;;
          *) echo "Unsupported architecture: $$ARCH" >&2; exit 1 ;;
        esac

        echo "Downloading sops for $$SOPS_ARCH..."
        $$DL "https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.$${SOPS_ARCH}" > /tmp/sops
        chmod +x /tmp/sops

        # Quick sanity check
        if ! /tmp/sops --version >/dev/null 2>&1; then
          echo "ERROR: downloaded sops binary is not executable or wrong architecture" >&2
          file /tmp/sops || true
          exit 1
        fi

        export SOPS_AGE_KEY_FILE=/run/secrets/age-key

        # Prefer exec-env (works best with dotenv files)
        exec /tmp/sops exec-env /run/secrets/renovate-token renovate

secrets:
  renovate-token:
    file: ./docker-compose.enc.env
  age-key:
    # Reaches out to your primary, master private age key file on the local NAS filesystem path
    file: /volume1/.config/age/keys.txt
