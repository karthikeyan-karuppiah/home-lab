upstreams:
  groups:
    default:
      - https://dns.quad9.net/dns-query
      # FIXED: Added the proper /dns-query secure path endpoint to Cloudflare
      - https://cloudflare-dns.com

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    # FIXED: Replaced human-readable site with direct raw malware and phishing lists
    malware:
      - https://firebog.net
      - https://firebog.net
    # FIXED: Replaced human-readable site with direct raw privacy and tracking list
    tracking:
      - https://firebog.net
  clientGroupsBlock:
    default:
      - ads
      - malware
      - tracking

  # What to return when a site is blocked (0.0.0.0 is fastest for browsers)
  blockType: zeroIp
  # Re-download list updates automatically every 4 hours in the background
  refreshPeriod: 4h

# Optimized cache storage to stop querying the internet for the same domains
caching:
  minTime: 5m
  maxTime: 30m
  # Prefetches frequently used domains before they expire in cache
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5

ports:
  dns: 53
  http: 4000

customDNS:
  mapping:
    music.home: 192.168.1.110