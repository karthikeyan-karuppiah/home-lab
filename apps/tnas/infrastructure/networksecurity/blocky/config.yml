upstreams:
  groups:
    default:
      - https://quad9.net
      - https://cloudflare-dns.com

blocking:
  denylists:
    ads:
      - https://githubusercontent.com
  clientGroupsBlock:
    default:
      - ads

# Ensure 'caching:' is typed against the far left edge of the page
caching:
  minTime: 5m
  maxTime: 30m

ports:
  dns: 53
  http: 4000
