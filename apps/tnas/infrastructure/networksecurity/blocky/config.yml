bootstrapDns:
  - upstream: tcp+udp:9.9.9.9
  - upstream: tcp+udp:1.1.1.1

upstreams:
  groups:
    default:
      - https://dns.quad9.net/dns-query
      - https://cloudflare-dns.com/dns-query

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    malware:
      - https://v.firebog.net/hosts/Prigent-Malware.txt
      - https://v.firebog.net/hosts/RPiList-Phishing.txt
    tracking:
      - https://v.firebog.net/hosts/Easyprivacy.txt
  clientGroupsBlock:
    default:
      - ads
      - malware
      - tracking

  blockType: zeroIp
  loading:
    refreshPeriod: 4h

caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5

ports:
  dns: 53
  http: 4000

customDNS:
  mapping:
    auth.home.lab: 192.168.1.110
    music.home: 192.168.1.110
    music.home.lab: 192.168.1.110
    wg.home.lab: 192.168.1.110
    npm.home.lab: 192.168.1.110

prometheus:
  enable: true
  path: /metrics
