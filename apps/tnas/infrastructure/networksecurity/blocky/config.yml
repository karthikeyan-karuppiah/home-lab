upstreams:
  groups:
    default:
      # FIX: Appended '/dns-query' endpoints required for DNS-over-HTTPS (DoH)
      - https://dns.quad9.net/dns-query
      - https://cloudflare-dns.com

blocking:
  denylists:
    ads:
      # FIX: Added 'raw.' prefix and mapped the full text target path to StevenBlack
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads

# Ensure 'caching:' is typed against the far left edge of the page
caching:
  minTime: 5m
  maxTime: 30m

ports:
  dns: 53
  http: 4000
