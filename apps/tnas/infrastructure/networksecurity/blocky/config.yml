upstreams:
  groups:
    default:
      - https://quad9.net
      - https://cloudflare-dns.com

blocking:
  denylists:
    ads:
      - https://githubusercontent.com
  clientGroupsBlock:
    default:
      - ads

# Shift caching all the way to the left (root level)
caching:
  minTime: 5m
  maxTime: 30m

ports:
  dns: 53
  http: 4000
