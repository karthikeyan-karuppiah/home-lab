upstreams:
  groups:
    default:
      - https://quad9.net
      - https://cloudflare-dns.com

blocking:
  denylists:
    ads:
      - https://githubusercontent.com
    malware:
      - https://firebog.net
      - https://firebog.net
    tracking:
      - https://firebog.net
  clientGroupsBlock:
    default:
      - ads
      - malware
      - tracking

  blockType: zeroIp
  refreshPeriod: 4h

caching:
  minTime: 5m
  maxTime: 30m
  # Prefetches frequently used domains before they expire in cache
  prefetching: true
  prefetchExpires: 2h
  prefetchThreshold: 5

ports:
  dns: 53
  http: 4000

customDNS:
  mapping:
    music.home: 192.168.1.110
    music.home.lab: 192.168.1.110
    auth.home.lab: 192.168.1.110

prometheus:
  enable: true
  path: /metrics
