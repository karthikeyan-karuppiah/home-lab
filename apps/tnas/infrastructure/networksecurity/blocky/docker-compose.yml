version: "3.8"

services:
  blocky:
    # Explicitly append the 'v' prefix required by spx01/blocky
    image: spx01/blocky:v0.30.0
    container_name: blocky
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "4000:4000"
    volumes:
      - ./config.yml:/app/config.yml
    environment:
      - TZ=Europe/Stockholm
    labels:
      - "cd.doco.image.update=true"
      # Enforce a semantic version template regex that handles the 'v' prefix if Doco-CD allows it
      - "cd.doco.image.policy=v0.30.0" 
