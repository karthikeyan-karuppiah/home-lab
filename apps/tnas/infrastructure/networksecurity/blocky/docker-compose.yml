version: "3.8"

services:
  blocky:
    # Explicitly append the 'v' prefix required by spx01/blocky
    # Change the registry path from spx01/blocky to ghcr.io/0xerr0r/blocky
    image: ghcr.io/0xerr0r/blocky:v0.36.0
    container_name: blocky
    restart: unless-stopped

    # CL-0007: Protect container root storage spaces against persistent malware injection vectors
    read_only: true

    # CL-0003: Lock process inheritance to avoid binary execution escalations
    security_opt:
      - no-new-privileges:true

    ports:
      # CL-0005: Core DNS service visibility ports exposed to serve local network subnets safely
      - "53:53/udp"
      - "53:53/tcp"
      # HTTP query management and statistics telemetry dashboard API
      - "4000:4000"

    volumes:
      # Keep your primary network configuration block mapped safely as an immutable resource reference
      - ./config.yml:/app/config.yml:ro

    tmpfs:
      # Ephemeral cache processing paths required under read-only root filesystems
      - /tmp
      - /run

    cap_drop:
      # CL-0006: Strip all default privileges and retain only the specific network binding flag required for raw DNS ports
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    environment:
      - TZ=Europe/Stockholm

    labels:
      - "cd.doco.image.update=true"
      # Enforce a semantic version template regex that handles the 'v' prefix if Doco-CD allows it
      # This matches the 'v' prefixed versioning used by the developers
      - "cd.doco.image.policy=v0.30.0"

    deploy:
      resources:
        limits:
          # CL-0026: Impose strict resource ceilings to prevent container execution loops from starving the host NAS
          cpus: '0.25'
          memory: 256M
