version: "3.8"

services:
  blocky:
    # Explicitly append the 'v' prefix required by spx01/blocky
    # Change the registry path from spx01/blocky to ghcr.io/0xerr0r/blocky
    image: ghcr.io/0xerr0r/blocky:v0.35.0
    container_name: blocky
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "4000:4000"
    volumes:
      - ./config.yml:/app/config.yml
    environment:
      - TZ=Europe/Stockholm  # Adjust to your timezone if necessary
    labels:
      - "cd.doco.image.update=true"
      # Enforce a semantic version template regex that handles the 'v' prefix if Doco-CD allows it
      # This matches the 'v' prefixed versioning used by the developers
      - "cd.doco.image.policy=v0.30.0"
