services:
    wg-easy:
        container_name: wg-easy
        env_file:
          - docker-compose.enc.env # Doco-CD decrypts this and injects the keys directly
        environment:
          - PUID=0  
          - PGID=0  
          - TZ=Europe/Brussels  
          - LANG=en
          # REMOVED THE BROKEN ${WG_HOST} LINES FROM HERE
        volumes:
            - /Volume1/DockerAppsData/Wireguard:/etc/wireguard
        ports:
            - 51820:51820/udp  
            - 51821:51821/tcp  
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
            - net.ipv4.ip_forward=1
        restart: always  
        image: ghcr.io/wg-easy/wg-easy
