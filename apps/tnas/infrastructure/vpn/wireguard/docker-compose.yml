services:
    wg-easy:
        container_name: wg-easy
        env_file:
            # Doco-CD decrypts this and injects the keys directly
            - docker-compose.enc.env
        environment:
            - PUID=0
            - PGID=0
            - TZ=Europe/Stockholm
            - LANG=en
            # REMOVED THE BROKEN ${WG_HOST} LINES FROM HERE
        volumes:
            - /Volume1/DockerAppsData/Wireguard:/etc/wireguard
        ports:
            - 51820:51820/udp
            # - 51821:51821/tcp - only reachable via the proxy network
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
            - net.ipv4.ip_forward=1
        restart: always
        image: ghcr.io/wg-easy/wg-easy
        networks:
            - proxy

        # Check that the WireGuard web UI is running on port 51821 (uses 127.0.0.1 instead of localhost to avoid IPv6 errors)
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 10
            start_period: 40s
networks:
    proxy:
        external: true
        name: proxy

