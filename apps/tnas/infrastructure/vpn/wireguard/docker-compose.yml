version: "3.8"

services:
  wg-easy:
    container_name: wg-easy
    # CL-0019: Pinned to exact stable version 15.5.0 along with its immutable container digest footprint
    image: ghcr.io/wg-easy/wg-easy:15.5.0@sha256:071f79a639e9361123a5e57733107320207b844ddbbd92dfa6962f541fe8aac8
    restart: unless-stopped
    
    # CL-0007: Deny container root filesystem mutations to block malware persistence vectors
    read_only: true
    
    # CL-0003: Prevent processes inside the container from gathering unexpected privilege scale-ups
    security_opt:
      - no-new-privileges:true
      
    ports:
      # CL-0005: Public ingress channels intentionally exposed to accept incoming traffic (Suppressed via .compose-lint.yaml)
      - "51820:51820/udp"  # WireGuard VPN tunnel connection port
      - "51821:51821/tcp"  # Web configuration dashboard admin interface
      
    # Safely parses your decrypted environment variables at deployment runtime
    env_file:
      - docker-compose.enc.env
      
    environment:
      # Map the neutral staging parameter key to the specific runtime environment signature required by wg-easy
      PASSWORD_HASH: ${WIREGUARD_UI_KEY}
      # Standard WireGuard operation configurations
      WG_PORT: 51820
      
    volumes:
      # Bypasses host NAS filesystem folder permission blocks using a named volume area
      - wireguard-storage:/etc/wireguard
      
    tmpfs:
      # Ephemeral operational locations supporting required write structures under read-only roots
      - /tmp
      - /run
      
    cap_drop:
      # CL-0006: Drop all default capabilities and add back only the specific flags required for kernel routing hooks
      - ALL
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      
    deploy:
      resources:
        limits:
          # CL-0026: Enforce hardware resource ceilings to safeguard the host NAS
          cpus: '0.50'
          memory: 512M

# ---------------------------------------------------------------
# Volume declarations
# ---------------------------------------------------------------
volumes:
  # Named storage allocations handled cleanly inside Docker's workspace area
  wireguard-storage:
