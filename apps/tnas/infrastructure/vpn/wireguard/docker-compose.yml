services:
    wg-easy:
        container_name: wg-easy
        environment:
          - PUID=0 # replace with your superuser id
          - PGID=0 # replace with your superuser group id
          - TZ=Europe/Brussels # replace with your timezone
          - LANG=en
          - WG_HOST=${WG_HOST}
          - WG_PASSWORD_HASH=${WG_PASSWORD_HASH}
          - PASSWORD_HASH=${PASSWORD_HASH}
        volumes:
            - /Volume1/DockerAppsData/Wireguard:/etc/wireguard
        ports:
            - 51820:51820/udp # leave as default or choose a different port for routed traffic
            - 51821:51821/tcp # leave as default or choose a different port for WebUI
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
            - net.ipv4.ip_forward=1
        restart: always # will always start at boot
        image: ghcr.io/wg-easy/wg-easy