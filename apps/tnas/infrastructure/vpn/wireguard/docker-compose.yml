services:
    wg-easy:
        container_name: wg-easy
        env_file:
            # Doco-CD decrypts this and injects the keys directly
            - docker-compose.enc.env
        environment:
            - PUID=0
            - PGID=0
            - TZ=Europe/Stockholm
            - LANG=en
            # REMOVED THE BROKEN ${WG_HOST} LINES FROM HERE
        volumes:
            - /Volume1/DockerAppsData/Wireguard:/etc/wireguard
        ports:
            - 51820:51820/udp
            - 51821:51821/tcp
        cap_add:
            - NET_ADMIN
            - SYS_MODULE
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
            - net.ipv4.ip_forward=1
        restart: always
        image: ghcr.io/wg-easy/wg-easy@sha256:5f26407fd2ede54df76d63304ef184576a6c1bb73f934a58a11abdd852fab549
        networks:
            - proxy

networks:
    proxy:
        external: true
        name: proxy

