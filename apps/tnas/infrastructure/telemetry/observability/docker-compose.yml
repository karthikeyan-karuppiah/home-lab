version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "0:0"  # <--- CRUCIAL! Overrides container permissions to solve the host folder block
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - /Volume1/DockerAppsData/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    user: "0:0"  # (Keeps Grafana working cleanly too!)
    ports:
      - "3000:3000"
    volumes:
      - /Volume1/DockerAppsData/grafana:/var/lib/grafana
    env_file:
      - docker-compose.enc.env # Doco-CD decrypts this and injects the keys directly