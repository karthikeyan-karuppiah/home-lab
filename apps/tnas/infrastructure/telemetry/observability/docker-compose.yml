version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: prometheus
    restart: unless-stopped
    user: "0:0"  # <--- CRUCIAL! Overrides container permissions to solve the host folder block
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - /Volume1/DockerAppsData/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: grafana
    restart: unless-stopped
    user: "0:0"  # (Keeps Grafana working cleanly too!)
    ports:
      - "3000:3000"
    volumes:
      - /Volume1/DockerAppsData/grafana:/var/lib/grafana
    env_file:
      - docker-compose.enc.env # Doco-CD decrypts this and injects the keys directly
