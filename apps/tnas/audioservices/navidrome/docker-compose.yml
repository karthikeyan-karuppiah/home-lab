services:
  navidrome:
    # copied from https://www.navidrome.org/docs/installation/docker/
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    #user: 1000:1000 # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: debug
    volumes:
      - "/Volume1/homes/<username>/navidrome/data:/data"
      - "/Volume1/homes/<username>/songs:/music:ro"
